<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель AI-Модерации</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

  <!-- Шапка админки -->
  <header class="admin-header">
    <div class="admin-nav-container">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <div>
          <span class="logo-title">Панель модератора AI</span>
          <span class="logo-badge">Gemini Flash Moderation</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="/" class="btn-link">← На главную платформы</a>
        <button id="refreshBtn" class="btn btn-secondary btn-sm">🔄 Обновить</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">

    <!-- Статистика -->
    <section class="stats-grid">
      <div class="stat-card" style="border-left-color: #2563eb;">
        <span class="stat-label">Всего сообщений</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card" style="border-left-color: #f59e0b;">
        <span class="stat-label">⚠️ Требуют внимания</span>
        <span class="stat-value" id="statAttention">0</span>
      </div>
      <div class="stat-card" style="border-left-color: #10b981;">
        <span class="stat-label">✅ Опубликовано</span>
        <span class="stat-value" id="statPublished">0</span>
      </div>
      <div class="stat-card" style="border-left-color: #ef4444;">
        <span class="stat-label">🔒 В карантине</span>
        <span class="stat-value" id="statQuarantine">0</span>
      </div>
      <div class="stat-card" style="border-left-color: #8b5cf6;">
        <span class="stat-label">🤖 Отклонено AI</span>
        <span class="stat-value" id="statRejectedAi">0</span>
      </div>
      <div class="stat-card" style="border-left-color: #64748b;">
        <span class="stat-label">⚡ Отбито RegEx</span>
        <span class="stat-value" id="statRegexBlocked">0</span>
      </div>
    </section>

    <!-- Навигация по очередям (Вкладки) -->
    <nav class="queue-tabs">
      <button class="queue-tab active" data-queue="attention">
        ⚠️ Требуют внимания
        <span class="tab-badge badge-warning" id="tabBadgeAttention">0</span>
      </button>
      <button class="queue-tab" data-queue="all">
        📋 Все сообщения
      </button>
      <button class="queue-tab" data-queue="regex">
        🛡️ Лог блокировок RegEx
      </button>
    </nav>

    <!-- Фильтры (для вкладки "Все сообщения") -->
    <div id="allMessagesFilterBar" class="filter-bar hidden">
      <div class="filter-group">
        <label>Статус:</label>
        <select id="filterStatus">
          <option value="">Все статусы</option>
          <option value="PUBLISHED">Опубликовано (PUBLISHED)</option>
          <option value="QUARANTINED">В карантине (QUARANTINED)</option>
          <option value="PENDING_MODERATION">На проверке (PENDING_MODERATION)</option>
          <option value="REJECTED_BY_AI">Отклонено AI (REJECTED_BY_AI)</option>
          <option value="REJECTED_BY_ADMIN">Отклонено модератором (REJECTED_BY_ADMIN)</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Тип:</label>
        <select id="filterType">
          <option value="">Все типы</option>
          <option value="REVIEW">Отзывы</option>
          <option value="COMMENT">Комментарии</option>
          <option value="TICKET">Заявки</option>
        </select>
      </div>
      <div class="filter-group checkbox-filter">
        <label>
          <input type="checkbox" id="filterHasReports"> Только с жалобами
        </label>
      </div>
    </div>

    <!-- Основной контент: Список сообщений модератора -->
    <section id="messagesContainer" class="messages-stream">
      <div class="loading-state">Загрузка данных...</div>
    </section>

    <!-- Контент: Логи RegEx -->
    <section id="regexContainer" class="messages-stream hidden">
      <div class="loading-state">Загрузка логов RegEx...</div>
    </section>

  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
